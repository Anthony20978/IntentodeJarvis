<text x="75" y="720" class="filename">src/jarvis/</text>
<text x="75" y="745" class="description">Contiene el núcleo de JARVIS y sus capacidades.</text>

<rect x="50" y="780" width="1100" height="80" rx="10" class="panel"/>
<text x="75" y="815" class="filename">src/jarvis/ia/</text>
<text x="75" y="840" class="description">Contiene el paquete de inteligencia artificial utilizado por JARVIS.</text>

<!-- INTELIGENCIA ARTIFICIAL -->
<text x="60" y="910" class="section">02 — src/jarvis/ia/</text>

<rect x="50" y="935" width="1100" height="710" rx="10" class="panel"/>

<g class="filename">
  <text x="80" y="980">__init__.py</text>
  <text x="80" y="1045">core.py</text>
  <text x="80" y="1110">language.py</text>
  <text x="80" y="1175">understanding.py</text>
  <text x="80" y="1240">neural.py</text>
  <text x="80" y="1305">learning.py</text>
  <text x="80" y="1370">context.py</text>
  <text x="80" y="1435">reasoning.py</text>
  <text x="80" y="1500">executor.py</text>
  <text x="80" y="1565">integrations.py</text>
</g>

<g class="description">
  <text x="340" y="980">Inicialización del paquete de inteligencia artificial.</text>
  <text x="340" y="1045">Coordina el cerebro de JARVIS.</text>
  <text x="340" y="1110">Procesa el lenguaje.</text>
  <text x="340" y="1175">Identifica intenciones y elementos de las instrucciones.</text>
  <text x="340" y="1240">Contiene la arquitectura de redes neuronales.</text>
  <text x="340" y="1305">Entrena y evalúa modelos propios.</text>
  <text x="340" y="1370">Gestiona el contexto de las conversaciones.</text>
  <text x="340" y="1435">Analiza problemas y planifica tareas.</text>
  <text x="340" y="1500">Comunica las decisiones con las capacidades internas.</text>
  <text x="340" y="1565">Gestiona conexiones opcionales con otras IA.</text>
</g>

<!-- MÓDULOS PRINCIPALES -->
<text x="60" y="1700" class="section">03 — src/jarvis/</text>
<rect x="50" y="1725" width="1100" height="330" rx="10" class="panel"/>

<g class="filename">
  <text x="80" y="1770">__init__.py</text>
  <text x="80" y="1815">main.py</text>
  <text x="80" y="1860">config.py</text>
  <text x="80" y="1905">brain.py</text>
  <text x="80" y="1950">memory.py</text>
  <text x="600" y="1770">capabilities.py</text>
  <text x="600" y="1815">platform.py</text>
</g>

<g class="description">
  <text x="290" y="1770">Organiza los módulos como paquete de Python.</text>
  <text x="290" y="1815">Inicia y coordina JARVIS.</text>
  <text x="290" y="1860">Gestiona parámetros, rutas y configuraciones.</text>
  <text x="290" y="1905">Procesa instrucciones.</text>
  <text x="290" y="1950">Guarda y recupera información local.</text>
  <text x="830" y="1770">Administra las funciones ejecutables.</text>
  <text x="830" y="1815">Adapta las funciones a otros entornos.</text>
</g>

